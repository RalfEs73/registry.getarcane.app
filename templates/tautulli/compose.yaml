services:
  tautulli:
    image: linuxserver/tautulli:${TAUTULLI_VERSION:-latest}
    container_name: tautulli
    restart: unless-stopped
    volumes:
      - ${TAUTULLI_CONFIG:-./config}:/config
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Europe/Berlin}
    ports:
      - "${TAUTULLI_PORT:-8181}:8181"
    networks:
      - extern

networks:
  extern:
    name: ${DOCKER_NETWORK:-extern}
    external: true
