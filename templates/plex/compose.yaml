services:
  plex:
    image: lscr.io/linuxserver/plex:${PLEX_VERSION:-latest}
    container_name: plex
    network_mode: host
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Europe/Berlin}
      - VERSION=docker
      - PLEX_CLAIM=${PLEX_CLAIM:-}
    volumes:
      - ${PLEX_CONFIG:-./plex}:/config
      - /mnt/plex-storage/:/Storage:ro
    restart: unless-stopped
