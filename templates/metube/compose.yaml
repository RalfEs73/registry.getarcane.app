services:
  metube:
    image: ghcr.io/alexta69/metube:${METUBE_VERSION:-latest}
    container_name: metube
    restart: unless-stopped
    ports:
      - "${METUBE_PORT:-8081}:8081"
    volumes:
      - /mnt/winserver_youtube:/downloads
      - ${METUBE_CONFIG:-./metube}:/config
    environment:
      - STATE_DIR=/config
